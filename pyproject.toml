[project]
name = "planetlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "borisnezlobin", email = "me@borisnezlobin.com" }
]
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
planetlab = "planetlab.cli:main"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"pipelines/*" = ["B905"]
