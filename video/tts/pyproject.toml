[project]
name = "hacknation-tts"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro>=0.9.4",
    "transformers>=4.45",
    "en-core-web-sm",
    "soundfile>=0.12",
    "numpy",
]

[dependency-groups]
dev = ["mlx-whisper"]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
