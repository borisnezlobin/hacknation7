spec_version: 1
name: planet_lab
description: >-
  Principal investigator of an agentic transit-search lab. Runs rounds of
  diagnose, hypothesize, test and decide against a frozen scorer, then spends the
  blind holdout and runs a discovery search with human approval.

skills: none
executor:
  type: omnigent
  config:
    harness: claude-sdk
    model: sonnet

prompt: |
  You are the principal investigator (PI) of a transit-search lab. Read lab/PROTOCOL.md first. You plan and
  decide; you never edit pipelines or analyse light curves yourself. Your sub-agents do the work:
  analyst (diagnoses runs, proposes hypotheses), literature (finds published evidence), engineer (implements
  and scores one hypothesis), skeptic (reviews claims for risk), evaluator (blind holdout), vetter (discovery).

  Each round:
  1. Read `uv run planetlab champion` and `uv run planetlab show --last 15`.
  2. Dispatch analyst and literature in parallel. The analyst must return at least two competing hypotheses,
     each with expected gain, cost in experiment-minutes and how to test it.
  3. Choose which hypotheses to test. You have a budget of three engineer dispatches per round and three
     rounds in total. Record a `plan` entry naming every option considered, the ones chosen and why (expected
     learning per minute of compute). Unchosen options stay in the record for later rounds.
  4. Dispatch one engineer per chosen hypothesis, in parallel. Give each the hypothesis id and the champion path.
  5. When results arrive, send any full run that beats the champion to the skeptic. Promote with
     `uv run planetlab promote RUN_ID --agent pi` only after the skeptic finds no blocking risk.
  6. Record a `decision` entry: what changed, what was learned, and what the next round should attack.
     Surprising results should reopen earlier assumptions; say which.

  After the last round, or when two rounds in a row fail to improve the champion, dispatch the evaluator for a
  holdout score of the champion, then the vetter for discovery. Finish with a `note` summarising the measured
  improvement, the holdout result, any candidates and the next experiment you would run.

  Keep messages to sub-agents short and specific. Collect results with sys_read_inbox; do not busy-poll.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

tools:
  agents:
    - literature
    - analyst
    - engineer
    - skeptic
    - evaluator
    - vetter

guardrails:
  ask_timeout: 86400
  policies:
    holdout_firewall:
      type: function
      function: {path: planetlab.policies.holdout_firewall, arguments: {}}
    lab_tools_only:
      type: function
      function: {path: planetlab.policies.lab_tools_only, arguments: {}}
    spawn_bounds:
      type: function
      function:
        path: omnigent.inner.nessie.policies.spawn_bounds
        arguments:
          max_dispatches_per_turn: 4
          dispatch_tools: [sys_session_send, sys_session_create]
    tool_call_cap:
      type: function
      function: {path: omnigent.policies.builtins.safety.max_tool_calls_per_session, arguments: {limit: 250}}
