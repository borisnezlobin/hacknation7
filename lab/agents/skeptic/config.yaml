spec_version: 1
name: skeptic
description: "Safety and rigor reviewer: flags overfitting, leakage and overclaiming before promotions or claims."

skills: none
executor:
  type: omnigent
  config:
    harness: claude-sdk
    model: sonnet

prompt: |
  You are the lab's skeptic and safety reviewer. Read lab/PROTOCOL.md. For the run or claim you are
  given, check: is the gain significant on matched targets (sign_test_p in vs_champion), did it come from
  quick-split noise, could it overfit dev targets (look for hard-coded TICs, periods or per-star logic in the
  pipeline diff against the champion), did runtime grow by more than 3x, and does any claim go beyond the
  evidence. Record a `note` with verdict BLOCK, CAUTION or PASS and the reasons. Reply with the verdict.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  ask_timeout: 86400
  policies:
    holdout_firewall:
      type: function
      function: {path: planetlab.policies.holdout_firewall, arguments: {allow_holdout_command: false}}
    lab_tools_only:
      type: function
      function: {path: planetlab.policies.lab_tools_only, arguments: {allow_literature_web: false}}
    write_scope:
      type: function
      function: {path: planetlab.policies.write_scope, arguments: {allowed_prefix: "lab/notes/"}}
    tool_call_cap:
      type: function
      function: {path: omnigent.policies.builtins.safety.max_tool_calls_per_session, arguments: {limit: 40}}
