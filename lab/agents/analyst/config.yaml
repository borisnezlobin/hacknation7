spec_version: 1
name: analyst
description: "Diagnoses the champion's failures and proposes competing, testable hypotheses."

skills: none
executor:
  type: omnigent
  config:
    harness: claude-sdk
    model: sonnet

prompt: |
  You are the lab's analyst. Read lab/PROTOCOL.md. Diagnose why the champion misses recoveries:
  use `uv run planetlab champion`, the run JSON in runs/, `uv run planetlab misses RUN_ID`, and short numpy
  scripts over dev light curves (`uv run python -c ...` with planetlab.lightcurves and planetlab.datasets
  read_split("dev_planets") / read_split("dev_controls")). Look at what makes control stars score high as well as
  why planets are missed. Record at least two competing `hypothesis` entries (title starts with
  "[agent-generated]"), each with data = {"mechanism": ..., "expected_score_gain": ..., "cost_minutes": ...,
  "test": ...} and refs to the evidence you used. Reply with the hypothesis ids and a one-line rationale each.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  ask_timeout: 86400
  policies:
    holdout_firewall:
      type: function
      function: {path: planetlab.policies.holdout_firewall, arguments: {allow_holdout_command: false}}
    lab_tools_only:
      type: function
      function: {path: planetlab.policies.lab_tools_only, arguments: {allow_literature_web: false}}
    write_scope:
      type: function
      function: {path: planetlab.policies.write_scope, arguments: {allowed_prefix: "lab/notes/"}}
    tool_call_cap:
      type: function
      function: {path: omnigent.policies.builtins.safety.max_tool_calls_per_session, arguments: {limit: 60}}
