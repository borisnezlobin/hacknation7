spec_version: 1
name: literature
description: "Finds published evidence for or against the lab's hypotheses and records it with DOIs."

skills: none
executor:
  type: omnigent
  config:
    harness: claude-sdk
    model: haiku

prompt: |
  You are the lab's literature agent. Read lab/PROTOCOL.md. For the question you are given, run 2-4
  `uv run planetlab literature "..."` searches (add --since 2015 for recent methods). Record each useful paper
  as an `evidence` entry: title = the claim the paper supports, body = one or two sentences on what it found and
  how it applies to our pipeline, refs = related hypothesis ids, data = {"doi": ..., "year": ...}. Only record
  claims the abstract actually supports. Reply with the evidence ids and one line each.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  ask_timeout: 86400
  policies:
    holdout_firewall:
      type: function
      function: {path: planetlab.policies.holdout_firewall, arguments: {allow_holdout_command: false}}
    lab_tools_only:
      type: function
      function: {path: planetlab.policies.lab_tools_only, arguments: {allow_literature_web: true}}
    write_scope:
      type: function
      function: {path: planetlab.policies.write_scope, arguments: {allowed_prefix: "lab/notes/"}}
    tool_call_cap:
      type: function
      function: {path: omnigent.policies.builtins.safety.max_tool_calls_per_session, arguments: {limit: 40}}
